name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm'
        version: '25.0.2'
        components: 'python'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        native-image-job-reports: 'true'
    - name: Set up Docker on macOS (Colima)
      if: runner.os == 'macOS'
      run: |
        # Ensure colima is not running and any old state is cleaned
        colima stop || true
        colima delete -f || true
        brew install colima docker
        # Start colima with explicit runtime
        colima start --cpu 2 --memory 4 --disk 60 --runtime docker --verbose
        # Wait for docker.sock to be available
        timeout 300 bash -c 'until [ -S ~/.colima/default/docker.sock ]; do sleep 5; done'
        # Link colima's docker socket to the default location for Testcontainers
        sudo ln -sf ~/.colima/default/docker.sock /var/run/docker.sock
        # Set permissions for the socket
        sudo chmod 666 /var/run/docker.sock
    - name: Build and Test
      run: mvn -B verify
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
        TESTCONTAINERS_RYUK_DISABLED: "true"
    - name: Build Native Image
      run: mvn -Pnative native:compile
